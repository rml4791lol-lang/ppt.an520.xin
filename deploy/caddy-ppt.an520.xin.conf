# ppt.an520.xin → anppt-v2（Next.js，127.0.0.1:3100）
# 切换/回滚步骤见 deploy/README.md。注意：Next.js 依赖内联 RSC 脚本，
# script-src 必须带 'unsafe-inline'（旧版白色站是 SPA，没有这条）。
ppt.an520.xin {
	encode zstd gzip

	header {
		Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:"
		Referrer-Policy "strict-origin-when-cross-origin"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
		Strict-Transport-Security "max-age=31536000"
	}

	reverse_proxy 127.0.0.1:3100 {
		header_up X-Real-IP {remote_host}
		transport http {
			dial_timeout 10s
			response_header_timeout 900s
		}
	}
}
